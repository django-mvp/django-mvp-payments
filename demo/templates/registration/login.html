{% extends "page_view.html" %}
{% load crispy_forms_tags i18n %}
{% block page.content %}
  <c-section title="{% trans 'Sign in' %}" icon="account_center">
    <form method="post">
      {% csrf_token %}
      {{ form|crispy }}
      <c-button type="submit" variant="primary">{% trans "Sign in" %}</c-button>
    </form>
  </c-section>
{% endblock page.content %}
