# Dependabot configuration, copied in from django-mvp/shared.
#
# The load-bearing choice is the grouping: one group per ecosystem matching "*",
# so a cycle's updates arrive as a SINGLE pull request. That is what makes
# auto-merge-dependabot.yml viable — one PR, one set of checks, merged when they
# pass. Partial grouping (a "django*" group, a "dev tools" group, everything else
# loose) opens a PR per package instead, and they accumulate faster than anyone
# merges them.
#
# `reviewers:` is deliberately absent. GitHub removed that option on 2025-08-08
# (announced 2025-04-29) because it overlapped with code owners; repos still
# carrying it are being silently ignored. Use a CODEOWNERS file if review
# assignment is wanted.
#
# There is no npm ecosystem here. This package ships no build pipeline of its
# own and declares no JavaScript dependency: a provider's script is loaded by
# the host project however that project already manages its frontend, and the
# demo loads Stripe's from their CDN. Dependabot has nothing here to watch.
version: 2
updates:
  # Python dependencies (uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"
    # mvp-shared is a git dependency pinned to a tag, and the same tag is
    # pinned again in every workflow that calls django-mvp/shared. The two have
    # to move together, which a Dependabot bump to pyproject.toml and uv.lock
    # alone cannot do, so the tag is bumped by hand when a shared release lands.
    ignore:
      - dependency-name: "mvp-shared"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
